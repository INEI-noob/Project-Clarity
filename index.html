<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project Clarity — a digital sanctuary for the LGBTQIA+ community of South Africa. Guides, resources, crisis support, and community. Safe, private, and judgment-free." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Project Clarity" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Project Clarity" />
    <meta property="og:url" content="https://projectclarity.site/" />
    <meta property="og:title" content="Project Clarity — A Sanctuary for the LGBTQIA+ Community" />
    <meta property="og:description" content="Guides, resources, crisis support, and community for the LGBTQIA+ community of South Africa. Safe, private, and judgment-free." />
    <meta property="og:image" content="/logo.webp" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project Clarity — A Sanctuary for the LGBTQIA+ Community" />
    <meta name="twitter:description" content="Guides, resources, crisis support, and community for the LGBTQIA+ community of South Africa." />
    <meta name="twitter:image" content="/logo.webp" />

    <link rel="canonical" href="https://projectclarity.site/" />

    <title>Project Clarity — A Sanctuary for the LGBTQIA+ Community</title>
    
    <!-- DNS prefetch and preconnect for performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical resources -->
    
    <!-- Privacy-friendly analytics (Plausible) — update the data-domain to your real domain -->
    <script defer data-domain="projectclarity.site" src="https://plausible.io/js/script.js"></script>

    <!-- Favicon (update path if you have one) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Prevent flash of wrong background before React loads -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom right, #f8fafc, #ffffff, #f8fafc);
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
      /* Hide content until React loads to prevent flash of unstyled content */
      .loading {
        opacity: 0;
        animation: fadeIn 0.3s ease-in 0.1s forwards;
      }
      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- 
      Vite will automatically inject the correct script tag here during build.
      For development, Vite serves this file and handles the module script injection.
      If you're not using Vite, change the src below to your main entry point:
      e.g., "/src/main.jsx" or "/src/index.js"
    -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- 
      Fallback for users with JavaScript disabled 
      (optional but good practice for accessibility)
    -->
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Sanctuary requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
