<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Sapphire | Cloudflare Pages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center text-white px-4">

    <div class="max-w-2xl w-full text-center space-y-8 animate-in fade-in duration-1000">
        <!-- Logo / Icon -->
        <div class="flex justify-center">
            <div class="p-4 bg-blue-500/10 rounded-2xl border border-blue-500/20 shadow-xl shadow-blue-500/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 010-.656l5.603-3.113z" />
                </svg>
            </div>
        </div>

        <!-- Content -->
        <div class="space-y-4">
            <h1 class="text-5xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Project Sapphire
            </h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-md mx-auto leading-relaxed">
                Successfully deployed to Cloudflare Workers Assets. Your static site is now live and globally distributed.
            </p>
        </div>

        <!-- Status Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
            <div class="p-4 rounded-xl bg-white/5 border border-white/10">
                <p class="text-xs font-semibold text-blue-400 uppercase tracking-wider mb-1">Status</p>
                <p class="text-sm text-slate-200">Production Environment</p>
            </div>
            <div class="p-4 rounded-xl bg-white/5 border border-white/10">
                <p class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1">Infrastructure</p>
                <p class="text-sm text-slate-200">Cloudflare Global Edge</p>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500">
            <p>&copy; 2026 Project Sapphire</p>
            <div class="flex gap-6">
                <a href="#" class="hover:text-blue-400 transition-colors">Documentation</a>
                <a href="#" class="hover:text-blue-400 transition-colors">Logs</a>
                <a href="#" class="hover:text-blue-400 transition-colors">Support</a>
            </div>
        </div>
    </div>

</body>
</html>
